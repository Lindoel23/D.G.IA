<div id="crt-overlay"></div>
<div class="container">
    <div class="card header-card">
        <div class="header-content">
            <h1>ALAVANCAS DE ENERGIA</h1>
            <div class="timer-box" id="timerDisplay">15:00.000</div>
        </div>
    </div>

    <div class="card main-card">
        <div class="levers-grid">
            <!-- Alavancas -->
            <div class="lever-group">
                <div class="lever-unit" data-id="0">
                    <div class="visor" id="visor-0">1</div>
                    <div class="lever-track">
                        <div class="lever-handle" id="lever-handle-0"></div>
                    </div>
                </div>
                <div class="lever-unit" data-id="1">
                    <div class="visor" id="visor-1">2</div>
                    <div class="lever-track">
                        <div class="lever-handle" id="lever-handle-1"></div>
                    </div>
                </div>
                <div class="lever-unit" data-id="2">
                    <div class="visor" id="visor-2">3</div>
                    <div class="lever-track">
                        <div class="lever-handle" id="lever-handle-2"></div>
                    </div>
                </div>
                <div class="lever-unit" data-id="3">
                    <div class="visor" id="visor-3">4</div>
                    <div class="lever-track">
                        <div class="lever-handle" id="lever-handle-3"></div>
                    </div>
                </div>
                <div class="lever-unit" data-id="4">
                    <div class="visor" id="visor-4">5</div>
                    <div class="lever-track">
                        <div class="lever-handle" id="lever-handle-4"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="meter-section">
            <div class="meter-labels">
                <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
            </div>
            <div class="meter-track">
                <div class="meter-needle" id="meterNeedle"></div>
            </div>
        </div>
    </div>

    <div class="card controls-card">
        <div class="cargo-section">
            <div class="cargo-label">ALAVANCA DE CARGA</div>
            <div class="cargo-track" id="cargoTrack">
                <div class="cargo-handle" id="cargoHandle">≡≡≡</div>
            </div>
        </div>
    </div>
</div>
