<div id="crt-overlay"></div>
<div id="purple-glow" class="hidden"></div>
<div class="container">

    <!-- CARD: Header / Título + Timer -->
    <div class="card header-card">
        <h1>PAINEL DE CONTROLE</h1>
        <div id="timer-box">15:00.000</div>
    </div>

    <!-- CARD: Grade de LEDs 5x5 -->
    <div class="card grid-card">
        <div class="grid-panel">
            <div></div>
            <div class="col-header">1</div>
            <div class="col-header">2</div>
            <div class="col-header">3</div>
            <div class="col-header">4</div>
            <div class="col-header">5</div>

            <div class="grid-label">A</div>
            <div class="grid-light" id="light-A1"></div>
            <div class="grid-light" id="light-A2"></div>
            <div class="grid-light" id="light-A3"></div>
            <div class="grid-light" id="light-A4"></div>
            <div class="grid-light" id="light-A5"></div>

            <div class="grid-label">B</div>
            <div class="grid-light" id="light-B1"></div>
            <div class="grid-light" id="light-B2"></div>
            <div class="grid-light" id="light-B3"></div>
            <div class="grid-light" id="light-B4"></div>
            <div class="grid-light" id="light-B5"></div>

            <div class="grid-label">C</div>
            <div class="grid-light" id="light-C1"></div>
            <div class="grid-light" id="light-C2"></div>
            <div class="grid-light" id="light-C3"></div>
            <div class="grid-light" id="light-C4"></div>
            <div class="grid-light" id="light-C5"></div>

            <div class="grid-label">D</div>
            <div class="grid-light" id="light-D1"></div>
            <div class="grid-light" id="light-D2"></div>
            <div class="grid-light" id="light-D3"></div>
            <div class="grid-light" id="light-D4"></div>
            <div class="grid-light" id="light-D5"></div>

            <div class="grid-label">E</div>
            <div class="grid-light" id="light-E1"></div>
            <div class="grid-light" id="light-E2"></div>
            <div class="grid-light" id="light-E3"></div>
            <div class="grid-light" id="light-E4"></div>
            <div class="grid-light" id="light-E5"></div>
        </div>
    </div>

    <!-- CARD: Controles (Faders + Botão) -->
    <div class="card controls-card">
        <div class="faders-row">
            <div class="fader-group">
                <label>PRESSÃO</label>
                <input type="range" id="fader-pressao" min="0" max="10" step="1" value="0">
                <span id="val-pressao" class="fader-val">0</span>
            </div>
            <div class="fader-group">
                <label>ENERGIA</label>
                <input type="range" id="fader-energia" min="0" max="10" step="1" value="0">
                <span id="val-energia" class="fader-val">0</span>
            </div>
        </div>
        <button id="btn-confirmar">CONFIRMAR</button>
    </div>

</div>
