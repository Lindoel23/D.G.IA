<div id="crt-overlay"></div>
<div id="purple-flash"></div>

<div class="container">
    <div class="card header-card">
        <div class="title">SISTEMA DE TRAVAS // CARAPAÇA</div>
        <div id="timerDisplay" class="timer">15:00.000</div>
    </div>

    <div class="card main-card">
        <div class="cables-container">
            <div class="cabo" id="cabo-1">
                <div class="cabo-linha"></div>
                <div class="cabo-label">CABO 1</div>
            </div>
            <div class="cabo" id="cabo-2">
                <div class="cabo-linha"></div>
                <div class="cabo-label">CABO 2</div>
            </div>
            <div class="cabo" id="cabo-3">
                <div class="cabo-linha"></div>
                <div class="cabo-label">CABO 3</div>
            </div>
            <div class="cabo" id="cabo-4">
                <div class="cabo-linha"></div>
                <div class="cabo-label">CABO 4</div>
            </div>
        </div>

        <div class="locks-container" id="locks-container">
            <div class="lock-wrapper">
                <div class="lock-dial" data-lock="0">
                    <div class="symbol-display" id="sym-0">○</div>
                </div>
            </div>
            <div class="lock-wrapper">
                <div class="lock-dial" data-lock="1">
                    <div class="symbol-display" id="sym-1">△</div>
                </div>
            </div>
            <div class="lock-wrapper">
                <div class="lock-dial" data-lock="2">
                    <div class="symbol-display" id="sym-2">□</div>
                </div>
            </div>
            <div class="lock-wrapper">
                <div class="lock-dial" data-lock="3">
                    <div class="symbol-display" id="sym-3">◇</div>
                </div>
            </div>
        </div>

        <div class="fase5-msg" id="fase5-msg" style="display:none;">
            TODAS AS TRAVAS LIBERADAS.<br>
            AGUARDANDO SINAL DE EXTRAÇÃO DO TERMINAL KIRLIAN.
        </div>
    </div>

    <div class="card controls-card" id="controls-card">
        <div class="btn-big-wrapper">
            <button id="btn-confirmar" class="btn-big"></button>
        </div>
    </div>
</div>
