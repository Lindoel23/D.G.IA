<div id="kirlian-st1-terminal" class="crt">
    <div id="kirlian-cursor"></div>
    <div class="scanlines"></div>

    <div class="terminal-header">
        <span class="sys-info">SISTEMA_KIRLIAN // ONLINE</span>
        <button id="st1-btn-manual" class="cmd-btn">[CTRL] MANUAL</button>
    </div>

    <div class="terminal-body" id="st1-main-screen">
        <!-- O conteúdo será injetado via JS (efeito máquina de escrever) -->
    </div>

    <div class="terminal-footer">
        <div class="footer-buttons">
            <button id="st1-btn-enter" class="cmd-btn">[ENTER]</button>
            <button id="st1-btn-reset" class="cmd-btn cmd-btn-reset">[RESET]</button>
        </div>
        <span id="st1-timer">> TEMPO: 15:00.000</span>
    </div>

    <!-- SOBREPOSIÇÃO: SÍMBOLOS DA CARAPAÇA -->
    <div id="st1-symbols-overlay" class="overlay hidden">
        <div class="overlay-box">
            <div id="st1-symbols-content"></div>
        </div>
    </div>

    <!-- SOBREPOSIÇÃO: MANUAL -->
    <div id="st1-manual-overlay" class="overlay hidden">
        <div class="manual-window">
            <div class="manual-header">
                <span id="st1-manual-title">MANUAL DE OPERAÇÃO</span>
                <button id="st1-btn-close-manual" class="cmd-btn">[ESC] FECHAR</button>
            </div>

            <div class="manual-content" id="st1-manual-text">
                <!-- Texto da página injetado aqui -->
            </div>

            <div class="manual-footer">
                <button id="st1-btn-prev" class="cmd-btn">← [←]</button>
                <div class="scroll-controls">
                    <button id="st1-btn-up" class="cmd-btn">↑ [↑]</button>
                    <button id="st1-btn-down" class="cmd-btn">↓ [↓]</button>
                </div>
                <button id="st1-btn-next" class="cmd-btn">→ [→]</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Senha do Reset -->
    <div id="st1-password-modal" class="overlay hidden">
        <div class="overlay-box modal-box">
            <div class="modal-title">═══ AUTENTICAÇÃO NECESSÁRIA ═══</div>
            <input type="password" id="st1-password-input" class="cmd-input" placeholder="DIGITE A SENHA">
            <div class="modal-buttons">
                <button id="st1-password-confirm" class="cmd-btn">[CONFIRMAR]</button>
                <button id="st1-password-cancel" class="cmd-btn">[CANCELAR]</button>
            </div>
            <div id="st1-password-error" class="modal-error hidden">▓▓ ACESSO NEGADO ▓▓</div>
        </div>
    </div>

    <!-- MODAL: Controle do Sistema -->
    <div id="st1-control-modal" class="overlay hidden">
        <div class="overlay-box modal-box">
            <div class="modal-title">═══ CONTROLE DO SISTEMA ═══</div>
            <div class="modal-buttons-vertical">
                <button id="st1-btn-pausar" class="cmd-btn cmd-btn-large">[PAUSAR SIMULAÇÃO]</button>
                <button id="st1-btn-resetar" class="cmd-btn cmd-btn-large cmd-btn-danger">[RESETAR TUDO]</button>
                <button id="st1-btn-fechar-controle" class="cmd-btn">[FECHAR]</button>
            </div>
        </div>
    </div>
</div>
